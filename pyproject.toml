[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-audit"
version = "0.1.0"
description = "Automated security review service for MCP repositories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "celery[redis]>=5.6,<6",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "packaging>=24,<26",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.16.2,<3",
    "redis>=5,<7",
    "semgrep>=1.100,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

