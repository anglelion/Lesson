x-backend-environment: &backend-environment
  MCP_AUDIT_ENVIRONMENT: "${MCP_AUDIT_ENVIRONMENT:-development}"
  MCP_AUDIT_DEBUG: "${MCP_AUDIT_DEBUG:-false}"
  MCP_AUDIT_DATABASE_URL: "${MCP_AUDIT_DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/mcp_audit}"
  MCP_AUDIT_REDIS_BROKER_URL: "${MCP_AUDIT_REDIS_BROKER_URL:-redis://redis:6379/0}"
  MCP_AUDIT_REDIS_RESULT_URL: "${MCP_AUDIT_REDIS_RESULT_URL:-redis://redis:6379/1}"
  MCP_AUDIT_TASK_TIME_LIMIT_SECONDS: "${MCP_AUDIT_TASK_TIME_LIMIT_SECONDS:-900}"
  MCP_AUDIT_CLONE_TIMEOUT_SECONDS: "${MCP_AUDIT_CLONE_TIMEOUT_SECONDS:-180}"
  MCP_AUDIT_TASK_RETRY_DELAY_SECONDS: "${MCP_AUDIT_TASK_RETRY_DELAY_SECONDS:-15}"
  MCP_AUDIT_SEMGREP_TIMEOUT_SECONDS: "${MCP_AUDIT_SEMGREP_TIMEOUT_SECONDS:-300}"
  MCP_AUDIT_SEMGREP_RULE_TIMEOUT_SECONDS: "${MCP_AUDIT_SEMGREP_RULE_TIMEOUT_SECONDS:-10}"
  MCP_AUDIT_SEMGREP_MAX_TARGET_BYTES: "${MCP_AUDIT_SEMGREP_MAX_TARGET_BYTES:-2000000}"
  MCP_AUDIT_OSV_TIMEOUT_SECONDS: "${MCP_AUDIT_OSV_TIMEOUT_SECONDS:-20}"
  MCP_AUDIT_DEPENDENCY_LIMIT: "${MCP_AUDIT_DEPENDENCY_LIMIT:-5000}"
  MCP_AUDIT_SECRET_SCAN_MAX_FILE_BYTES: "${MCP_AUDIT_SECRET_SCAN_MAX_FILE_BYTES:-2000000}"
  MCP_AUDIT_ALLOWED_REPO_HOSTS: '${MCP_AUDIT_ALLOWED_REPO_HOSTS:-["github.com","gitee.com","gitlab.com"]}'
  MCP_AUDIT_REPOSITORY_MAX_BYTES: "${MCP_AUDIT_REPOSITORY_MAX_BYTES:-250000000}"
  MCP_AUDIT_REPOSITORY_MAX_FILES: "${MCP_AUDIT_REPOSITORY_MAX_FILES:-50000}"
  HOME: /tmp
  XDG_CACHE_HOME: /tmp/.cache
  SEMGREP_SETTINGS_FILE: /tmp/semgrep-settings.yml

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mcp_audit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mcp_audit"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    command:
      [
        "celery",
        "-A",
        "backend.app.celery_app:celery",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
      ]
    read_only: true
    tmpfs:
      - /tmp:size=1g,exec
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:

